name: Update personalized declarations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update_declarations.yml'
      - 'Code/scripts/fill_student_declarations.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependency
        run: python -m pip install reportlab
      - name: Regenerate two declarations
        run: python Code/scripts/fill_student_declarations.py
      - name: Commit declarations
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Declarations
          if (!(git diff --cached --quiet)) {
            git commit -m "Use simple student signature line in declarations"
            git push origin HEAD:main
          }
