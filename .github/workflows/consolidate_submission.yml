name: Consolidate capstone submission
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate_submission.yml'
      - 'scripts/consolidate_submission.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF merge dependency
        run: python -m pip install pypdf
      - name: Build consolidated documents and remove redundant files
        run: python scripts/consolidate_submission.py
      - name: Commit minimal eight-folder submission
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Synopsis Documentation Model_Prompts_Config Evaluation_Results Declarations SUBMISSION_README.md
          if ! git diff --cached --quiet; then
            git commit -m "Keep concise submission PDFs in eight required folders"
            git push origin HEAD:main
          else
            echo "No changes needed"
          fi
