name: Fill student declarations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fill_student_declarations.yml'
      - 'scripts/fill_student_declarations.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF rendering dependency
        run: python -m pip install reportlab
      - name: Render personalized declaration PDFs
        run: python scripts/fill_student_declarations.py
      - name: Commit updated declarations
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Declarations/Academic_Integrity_Declaration.pdf Declarations/AI_Tool_Usage_Declaration.pdf
          if (git diff --cached --quiet) {
            Write-Output "Declarations unchanged"
          } else {
            git commit -m "Fill declarations with student details and typed signature"
            git push origin HEAD:main
          }
